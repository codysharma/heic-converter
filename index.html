<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIC to JPG Converter</title>
</head>
<body>
    <h2>Cody's Photo Converter - HEIC to JPG</h2>

    <input type="file" id="fileInput" accept=".heic,.heif" multiple />
    <button onclick="convert()">Convert</button>
    <p id="progress"></p>
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        async function convert() {
            const input = document.getElementById("fileInput");
            const files = [...input.files].filter(f => /\.(heic|heif)$/i.test(f.name));
            const progress = document.getElementById("progress");
            const results = document.getElementById("results");
            results.innerHTML = "";

            if (files.length === 1) {
                const file = files[0];
                progress.textContent = `Converting 1/1...`;

                const jpegBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 1 });
                const url = URL.createObjectURL(jpegBlob);
                const name = file.name.replace(/\.(heic|heif)$/i, ".jpg");
                results.innerHTML = `<p>✔ <a href="${url}" download="${name}">Download ${name}</a></p>`;

            } else {
                const zip = new JSZip();
                const folder = zip.folder("converted");

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    progress.textContent = `Converting ${i + 1}/${files.length}...`;

                    const jpegBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 1 });
                    const name = file.name.replace(/\.(heic|heif)$/i, ".jpg");
                    folder.file(name, jpegBlob);
                }

                progress.textContent = "Zipping...";
                const zipBlob = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(zipBlob);
                results.innerHTML = `<p>✔ <a href="${url}" download="converted.zip">Download converted.zip</a></p>`;
            }

            progress.textContent = "Done!";
        }
    </script>
</body>
</html>
